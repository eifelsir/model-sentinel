name: Bug report / 问题反馈
description: Report a reproducible application issue.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private endpoints, or unredacted exports. 请勿上传 KEY、私有地址或未脱敏配置。"
  - type: input
    id: version
    attributes:
      label: App version / 版本号
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 x64
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol / 协议
      options:
        - Responses API
        - Chat Completions
        - Gemini native
        - Claude Messages
        - Desktop UI / Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Anonymized response or screenshot / 脱敏回复或截图
