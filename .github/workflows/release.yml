name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching package.json (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build portable executable
        run: npm exec electron-builder -- --win portable --x64 --config.electronDist=node_modules/electron/dist
      - name: Verify packaged application
        run: node scripts/packaged-smoke.mjs
      - name: Verify exact portable and relaunch
        run: node scripts/portable-smoke.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $binary = Get-ChildItem release/Model-Sentinel-*-Windows-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($binary.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          gh release create "$env:RELEASE_TAG" "$($binary.FullName)" release/SHA256SUMS.txt --title "Model Sentinel $env:RELEASE_TAG" --generate-notes
